name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * *" 
  repository_dispatch:
    types: [beauty-salons-push]
  workflow_dispatch:
    inputs:
      api_ref:
        description: "beauty-salons branch, tag or commit to test"
        required: false
        default: "main"
      markers:
        description: "Marker expression for the API tests, e.g. smoke (empty = all)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    name: Framework self-tests (Python ${{ matrix.python-version }})
    # A push to beauty-salons can't break the framework, so skip the matrix for it.
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m framework
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-reports-py${{ matrix.python-version }}
          path: reports/

  api-tests:
    name: beauty-salons API tests
    needs: framework
    # Run after the framework passes, or straight away when framework was skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      API_REF: ${{ github.event.client_payload.sha || inputs.api_ref || 'main' }}
      MARKERS: ${{ inputs.markers }}
      API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Check out beauty-salons
        uses: actions/checkout@v4
        with:
          repository: fedealdosivi/beauty-salons
          ref: ${{ env.API_REF }}
          path: beauty-salons

      # The API repo owns its infrastructure: Postgres loads migrations/ (schema + seed
      # data) on first start, so the tests always run against the seed in that commit.
      - name: Start Postgres and Elasticsearch
        run: docker compose -f beauty-salons/docker-compose.yml up -d --wait --wait-timeout 300 postgres elasticsearch

      - uses: actions/setup-go@v5
        with:
          go-version-file: beauty-salons/go.mod
          cache-dependency-path: beauty-salons/go.sum

      - name: Build and start the API
        env:
          DATABASE_URL: postgres://beauty:beauty123@localhost:5432/beauty_salons?sslmode=disable
          ELASTICSEARCH_URL: http://localhost:9200
          PORT: "8080"
          GIN_MODE: release
        run: |
          (cd beauty-salons && go build -o ../beauty-salons-api ./cmd/api)
          nohup ./beauty-salons-api > api.log 2>&1 &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 "$API_BASE_URL/health"

      - name: Sync Postgres to Elasticsearch
        run: curl -sf -X POST "$API_BASE_URL/api/v1/admin/sync"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run API tests
        run: |
          echo "Testing beauty-salons @ $(git -C beauty-salons rev-parse --short HEAD) ($API_REF)" >> "$GITHUB_STEP_SUMMARY"
          pytest -m "${MARKERS:+($MARKERS) and }not framework"

      - name: Show API log
        if: failure()
        run: cat api.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: |
            reports/
            logs/
            api.log
