[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
    --junitxml=reports/junit.xml
    --html=reports/report.html --self-contained-html
junit_family = xunit2
markers =
    smoke: fast, critical checks to run on every change
    regression: the full suite, usually run nightly or before a release
    framework: offline self-tests of the framework itselfs
